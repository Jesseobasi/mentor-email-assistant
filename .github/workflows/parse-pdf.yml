name: Update Calendar Database

on:
  push:
    paths:
      - 'calendar.pdf'

jobs:
  parse-calendar:
    runs-on: ubuntu-latest
    permissions:
      contents: write # Needed to commit the JSON file back

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          
      - name: Install dependencies
        working-directory: ./mentor-email-assistant
        run: npm install

      - name: Parse PDF and Build Database
        working-directory: ./mentor-email-assistant
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: node src/pdfParser.js

      - name: Commit Database Changes
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore: update calendar database from new PDF"
          file_pattern: "mentor-email-assistant/src/data/calendar_database.json"
